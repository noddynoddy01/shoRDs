# 🏛️ shoRDs — Deep-Technical Master Architecture Presentation
> **Engineering Whitepaper & System Architecture Specification for Chief Technology Officers, Systems Architects, and Technical Reviewers**

## 📑 Slide 1: Executive Architectural Overview & Value Proposition

### 1.1 The Core Problem & The Academic Bandwidth Bottleneck
Modern scientific literature is scaling exponentially (>5M publications annually). R&D teams and researchers suffer from:
* **The Unstructured PDF Ingestion Bottleneck**: Scientific findings, numerical bounds, and vector figures are locked in unsearchable, non-standardized multi-page PDF documents.
* **The Generic LLM Hallucination Trap**: Base language models (ChatGPT, vanilla RAG) hallucinate empirical numbers (e.g. swapping AUROC scores or p-values) and fabricate non-existent PMIDs/DOIs due to the lack of deterministic claim verification.
* **Lack of Multimodal Interactivity**: Absence of mobile-native gesture physics, background audio streaming, and interactive relational citation topologies.

### 1.2 Technical Solution: The shoRDs Research OS
An open-access, AI-orchestrated Research Operating System that unifies:
1. **Multi-Pass Document Chunking & 4-Section Digest Normalization** (`paperSummarizer.ts`).
2. **Authoritative Claim-First Verification Gate** (`claimVerification.ts`).
3. **Provider-Agnostic AI Gateway** (`aiGateway.ts`) with dynamic model routing, circuit breaking, and micro-dollar cost tracking.
4. **Relational Knowledge Graph Engine** (`researchGraphService.ts`) on PostgreSQL 16 + Redis 7.2.
5. **Universal Native Client** on React Native 0.81 / Expo Router v6 (Android Kotlin + Web PWA).

## 🔬 Slide 3: Deep Dive — Claim-First Verification Protocol

Traditional RAG trusts the generative model to synthesize text. In **shoRDs**, the generative model is strictly an **untrusted candidate generator**.

```
                           THE CLAIM VERIFICATION ALGORITHM
                           ================================

 Candidate LLM Output:
 "The architecture achieved 0.924 AUROC on MIMIC-IV and completely cures sepsis [Chunk: chunk_1842]."
                                         │
                                         ▼
                     [ Assertion Tuple Decomposition ]
   Assertion 1: { text: "0.924 AUROC on MIMIC-IV", chunkId: "chunk_1842", metric: 0.924 }
   Assertion 2: { text: "cures sepsis", chunkId: "chunk_1842", metric: null, causal: true }
                                         │
                                         ▼
             [ Deterministic Verification Function: Verify(c_i) ]
   
   Chunk Data: { chunk_id: "chunk_1842", paper_id: "openalex-W123", section: "Results", 
                 page: 8, text: "Achieved 0.924 AUROC on MIMIC-IV under differential privacy." }
                                         │
                    ┌────────────────────┴────────────────────┐
                    ▼                                         ▼
   Assertion 1:                               Assertion 2:
   • Paper ID Match?   ✅ Yes                  • Text containment?    ❌ No ("cures" not in text)
   • Section Match?    ✅ Yes                  • Causal claim valid?  ❌ No (unsupported leap)
   • Page Match?       ✅ Yes                                         │
   • Metric Match?     ✅ Yes (0.924 in text)                         ▼
                    │                                          [ STRIPPED ]
                    ▼                                   (Deleted from response)
              [ ACCEPTED ]
                    │
                    ▼
   Final Output: "The architecture achieved 0.924 AUROC on MIMIC-IV [openalex-W123:p.8]."
```
